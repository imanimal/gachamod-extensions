name: Build index

on:
  push:
    branches: [main]
    paths: ["packages/**", "tools/**", ".github/workflows/**"]
  pull_request:
    paths: ["packages/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check packages
        if: github.event_name == 'pull_request'
        run: python3 tools/build_index.py --check
      - name: Build zips and index.json
        if: github.event_name != 'pull_request'
        run: python3 tools/build_index.py
      - name: Commit
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json dist
          git diff --cached --quiet || (git commit -m "Update index" && git push)
