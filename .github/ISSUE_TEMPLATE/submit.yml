name: Submit an extension or theme
description: Ask for a package to be listed in gachamod.
title: "Submit: "
body:
  - type: markdown
    attributes:
      value: |
        Attach the .zip gachamod made for you. For an extension that's Extensions, More, Share a package. For a theme,
        open its menu under Settings, Custom themes and pick Share to the theme list.
        Extensions run code, so each one is read before it's listed. Updates go the same way: attach the new zip.
  - type: input
    id: name
    attributes:
      label: Name
    validations:
      required: true
  - type: textarea
    id: package
    attributes:
      label: Package
      description: Drag the .zip here.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: What changed in an update, other apps it works with, anything a reviewer should know.
